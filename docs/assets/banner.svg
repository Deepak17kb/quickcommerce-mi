<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="ShelfPulse: quick-commerce market intelligence across Blinkit, Swiggy Instamart, Flipkart Minutes and BigBasket">
  <defs>
    <radialGradient id="g1" cx="12%" cy="18%" r="55%">
      <stop offset="0" stop-color="#c9f24a" stop-opacity=".42"/>
      <stop offset="1" stop-color="#c9f24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="92%" cy="92%" r="50%">
      <stop offset="0" stop-color="#2a78d6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="60%" cy="0%" r="40%">
      <stop offset="0" stop-color="#eb6834" stop-opacity=".22"/>
      <stop offset="1" stop-color="#eb6834" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".09"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2129"/>
      <stop offset="1" stop-color="#16181e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1280" height="400" rx="28" fill="#0d0e12"/>
  <rect width="1280" height="400" rx="28" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="28" fill="url(#g1)"/>
  <rect width="1280" height="400" rx="28" fill="url(#g2)"/>
  <rect width="1280" height="400" rx="28" fill="url(#g3)"/>

  <!-- logo and words -->
  <g transform="translate(72 78)">
    <rect width="64" height="64" rx="18" fill="#c9f24a"/>
    <path d="M36.7 9.3 14.9 38.4h17L29.5 56l21.8-29.1h-17z" fill="#1b2500"/>
    <text x="84" y="47" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#f4f5f7" letter-spacing="-1.5">ShelfPulse</text>
  </g>
  <text x="72" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="41" font-weight="800" fill="#f4f5f7" letter-spacing="-1.2">One day of Blinkit, collected by hand.</text>
  <text x="72" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="41" font-weight="800" fill="#f4f5f7" letter-spacing="-1.2">Here is what it <tspan fill="#c9f24a">revealed</tspan>.</text>
  <text x="74" y="318" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#b9bcc6">Bhubaneswar · 21,949 listings logged by hand · a pricing engine tested in the Lab</text>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="72" y="342" width="154" height="30" rx="15" fill="#c9f24a"/><text x="149" y="362" text-anchor="middle" fill="#1b2500">4 findings</text>
    <rect x="236" y="342" width="168" height="30" rx="15" fill="none" stroke="#3a3d47" stroke-width="1.5"/><text x="320" y="362" text-anchor="middle" fill="#f4f5f7">21 data contracts</text>
    <rect x="414" y="342" width="196" height="30" rx="15" fill="none" stroke="#3a3d47" stroke-width="1.5"/><text x="512" y="362" text-anchor="middle" fill="#f4f5f7">every number tagged</text>
  </g>

  <!-- the four findings, as on the site -->
  <g transform="translate(866 64)" filter="url(#shadow)">
    <rect width="344" height="272" rx="22" fill="url(#card)" stroke="#2c2f38"/>
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <rect x="22" y="22" width="92" height="24" rx="12" fill="#12301f" stroke="#3fd08a" stroke-opacity=".6"/>
      <text x="68" y="39" text-anchor="middle" font-size="12" font-weight="800" fill="#3fd08a">Observed</text>
      <text x="22" y="76" font-size="17" font-weight="800" fill="#f4f5f7">What the observed day revealed</text>
      <line x1="22" y1="91" x2="322" y2="91" stroke="#262932"/>
      <text x="22" y="128" font-size="22" font-weight="800" fill="#3fd08a">70 / 100</text>
      <text x="118" y="126" font-size="13.5" font-weight="600" fill="#e6e7ea">top flags are one data defect</text>
      <line x1="22" y1="142" x2="322" y2="142" stroke="#262932"/>
      <text x="22" y="168" font-size="22" font-weight="800" fill="#3fd08a">6.4×</text>
      <text x="118" y="166" font-size="13.5" font-weight="600" fill="#e6e7ea">stock-outs cluster by product</text>
      <line x1="22" y1="182" x2="322" y2="182" stroke="#262932"/>
      <text x="22" y="208" font-size="22" font-weight="800" fill="#3fd08a">27</text>
      <text x="118" y="206" font-size="13.5" font-weight="600" fill="#e6e7ea">prices looked up, not seen</text>
      <line x1="22" y1="222" x2="322" y2="222" stroke="#262932"/>
      <text x="22" y="248" font-size="22" font-weight="800" fill="#3fd08a">0 / 10</text>
      <text x="118" y="246" font-size="13.5" font-weight="600" fill="#e6e7ea">tests find any store effect</text>
    </g>
  </g>
</svg>
