<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Qcom: quick-commerce market intelligence across Blinkit, Swiggy Instamart, Flipkart Minutes and BigBasket">
  <defs>
    <radialGradient id="g1" cx="12%" cy="18%" r="55%">
      <stop offset="0" stop-color="#c9f24a" stop-opacity=".42"/>
      <stop offset="1" stop-color="#c9f24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="92%" cy="92%" r="50%">
      <stop offset="0" stop-color="#2a78d6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="60%" cy="0%" r="40%">
      <stop offset="0" stop-color="#eb6834" stop-opacity=".22"/>
      <stop offset="1" stop-color="#eb6834" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".09"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2129"/>
      <stop offset="1" stop-color="#16181e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1280" height="400" rx="28" fill="#0d0e12"/>
  <rect width="1280" height="400" rx="28" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="28" fill="url(#g1)"/>
  <rect width="1280" height="400" rx="28" fill="url(#g2)"/>
  <rect width="1280" height="400" rx="28" fill="url(#g3)"/>

  <!-- logo and words -->
  <g transform="translate(72 78)">
    <rect width="64" height="64" rx="18" fill="#c9f24a"/>
    <path d="M36.7 9.3 14.9 38.4h17L29.5 56l21.8-29.1h-17z" fill="#1b2500"/>
    <text x="84" y="47" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#f4f5f7" letter-spacing="-1.5">Qcom</text>
  </g>
  <text x="72" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#f4f5f7" letter-spacing="-1.4">Who is <tspan fill="#c9f24a">cheapest</tspan>, what is in stock,</text>
  <text x="72" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#f4f5f7" letter-spacing="-1.4">how fast it arrives.</text>
  <text x="74" y="318" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#b9bcc6">Bhubaneswar · 610,789 observations · 4 apps · 30 stores</text>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="72" y="342" width="154" height="30" rx="15" fill="#c9f24a"/><text x="149" y="362" text-anchor="middle" fill="#1b2500">13 deliverables</text>
    <rect x="236" y="342" width="168" height="30" rx="15" fill="none" stroke="#3a3d47" stroke-width="1.5"/><text x="320" y="362" text-anchor="middle" fill="#f4f5f7">21 data contracts</text>
    <rect x="414" y="342" width="196" height="30" rx="15" fill="none" stroke="#3a3d47" stroke-width="1.5"/><text x="512" y="362" text-anchor="middle" fill="#f4f5f7">every number tagged</text>
  </g>

  <!-- a price board, as on the site -->
  <g transform="translate(866 64)" filter="url(#shadow)">
    <rect width="344" height="272" rx="22" fill="url(#card)" stroke="#2c2f38"/>
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <rect x="22" y="22" width="52" height="24" rx="12" fill="#262f0f" stroke="#c9f24a" stroke-opacity=".6"/>
      <text x="48" y="39" text-anchor="middle" font-size="12" font-weight="800" fill="#c9f24a">Lab</text>
      <text x="322" y="39" text-anchor="end" font-size="12" font-weight="600" fill="#8b8f9c">check of 14 Oct, 09:00</text>
      <text x="22" y="76" font-size="17" font-weight="800" fill="#f4f5f7">Frooti Mango Drink, 2 L</text>
      <g font-size="15" font-weight="600" fill="#e6e7ea">
        <circle cx="28" cy="111" r="5" fill="#3987e5"/><text x="42" y="116">Blinkit</text>
        <rect x="170" y="106" width="100" height="10" rx="5" fill="#3987e5" fill-opacity=".85"/>
        <text x="322" y="116" text-anchor="end" font-weight="800">₹105</text>
        <circle cx="28" cy="149" r="5" fill="#d95926"/><text x="42" y="154">Instamart</text>
        <rect x="170" y="144" width="105" height="10" rx="5" fill="#d95926" fill-opacity=".85"/>
        <text x="322" y="154" text-anchor="end" font-weight="800">₹110</text>
        <circle cx="28" cy="187" r="5" fill="#199e70"/><text x="42" y="192">Flipkart Minutes</text>
        <rect x="170" y="182" width="91" height="10" rx="5" fill="#199e70" fill-opacity=".85"/>
        <text x="322" y="192" text-anchor="end" font-weight="800" fill="#c9f24a">₹95</text>
        <circle cx="28" cy="225" r="5" fill="#c98500"/><text x="42" y="230">BigBasket</text>
        <rect x="170" y="220" width="110" height="10" rx="5" fill="#c98500" fill-opacity=".85"/>
        <text x="322" y="230" text-anchor="end" font-weight="800">₹115</text>
        <text x="22" y="258" font-size="11.5" font-weight="600" fill="#8b8f9c">simulated panel, tagged Lab on every number</text>
      </g>
      <line x1="22" y1="91" x2="322" y2="91" stroke="#262932"/>
    </g>
  </g>
</svg>
